
name: Tool Cantam Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build, Test and Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore .\tool-cantam.sln

      - name: Build Release
        run: dotnet build .\tool-cantam.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test .\tool-cantam.sln --configuration Release --no-build

      - name: Publish Windows x64
        run: dotnet publish .\tool-cantam.csproj --configuration Release --runtime win-x64 --self-contained true --output .\publish

      - name: Create ZIP package
        shell: pwsh
        run: |
          $zipName = "Tool-Cantam-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path ".\publish\*" -DestinationPath $zipName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: Tool-Cantam-${{ github.ref_name }}-win-x64.zip
